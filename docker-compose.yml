version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/draftwarroom.db
      - APP_ENV=development
    restart: unless-stopped

volumes:
  db-data:
